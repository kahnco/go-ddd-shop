name: CI

# 원래 CI 는 아래처럼 main 푸시·PR 마다 자동으로 돈다.
# 이 튜토리얼 리포에서는 불필요한 실행을 피하려 "수동 실행(workflow_dispatch)"만 켜 두었다.
# 실제 프로젝트에서는 아래 push/pull_request 주석을 풀어 자동화한다.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: 포맷 검사(gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt 가 필요한 파일:"; echo "$unformatted"; exit 1
          fi

      - name: 정적 검사(go vet)
        run: go vet ./...

      # ubuntu 러너에는 도커가 있어, testcontainers(Postgres)·임베디드 NATS 통합 테스트까지 그대로 돈다.
      - name: 테스트(go test)
        run: go test -race ./...

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ordering 이미지 빌드
        run: docker build --build-arg SERVICE=ordering -t ordering:ci .
      - name: inventory 이미지 빌드
        run: docker build --build-arg SERVICE=inventory -t inventory:ci .
      - name: promotion 이미지 빌드
        run: docker build --build-arg SERVICE=promotion -t promotion:ci .

  # 부하 게이트 — promotion 접수 경로의 성능 회귀·오류를 자동으로 잡는다.
  # sync 모드(Postgres 행 잠금)로 실제 순번 배정 경로를 재고, p99·오류 임계값을 넘으면 실패.
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      - name: 의존성 기동(nats, postgres)
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine
          docker run -d --name pg -e POSTGRES_PASSWORD=secret -e POSTGRES_USER=shop \
            -e POSTGRES_DB=shop -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U shop && break; sleep 1; done

      - name: promotion 기동(sync)
        run: |
          go build -o /tmp/promo ./cmd/promotion
          DATABASE_URL="postgres://shop:secret@localhost:5432/shop?sslmode=disable" \
          NATS_URL="nats://localhost:4222" INGEST=sync EVENT_ID=ci EVENT_TARGET=100000000 \
          RATE_BURST=100000000 RATE_PER_SEC=100000000 HTTP_ADDR=:8080 /tmp/promo &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 0.5; done

      - name: 부하 테스트(p99·오류 게이트)
        run: |
          go run ./cmd/promotion-loadtest -url http://localhost:8080 -event ci \
            -label "CI sync" -c 50 -n 3000 -max-p99-ms 800 -max-err 0
