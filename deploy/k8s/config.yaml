# 설정과 비밀을 코드·이미지에서 분리한다(12-factor).
# 비밀이 아닌 설정만 여기(ConfigMap)에 둔다.
#
# 비밀(DB 비번·DSN·JWT 키)은 이 파일에 두지 않는다 — git 에 평문으로 커밋하지 않으려고,
# SOPS+age 로 암호화한 deploy/k8s/secrets.enc.yaml 로 분리했다.
#   적용:  bash deploy/sops/apply.sh   (sops --decrypt secrets.enc.yaml | kubectl apply -f -)
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  APP_ENV: "production" # 운영 모드 — 서비스가 기본/빈 JWT_SECRET 으로 뜨는 걸 거부한다
  NATS_URL: "nats://nats:4222"
  NATS_JETSTREAM: "1" # JetStream(영속 스트림 + 내구 소비자) 사용
  CATALOG_URL: "http://catalog" # 주문 서비스가 가격 프로젝션을 부트스트랩하는 곳
  OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317" # OpenTelemetry span 을 Jaeger 로 내보냄
  REDIS_URL: "redis://redis:6379" # promotion 분산 레이트 리밋 + 종료 배치 분산락
