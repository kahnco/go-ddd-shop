# 시크릿 템플릿(플레이스홀더 — 커밋해도 안전).
# 실제 값을 채워 SOPS 로 암호화한 secrets.enc.yaml 만 클러스터에 적용한다.
#
#   cp secrets.example.yaml secrets.filled.yaml   # 실제 값 채우기(gitignore 됨)
#   sops --encrypt secrets.filled.yaml > secrets.enc.yaml
#   rm secrets.filled.yaml
#
# 적용:  sops --decrypt secrets.enc.yaml | kubectl apply -f -   (deploy/sops/apply.sh)
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shop
type: Opaque
stringData:
  POSTGRES_USER: shop
  POSTGRES_PASSWORD: REPLACE_WITH_STRONG_PASSWORD
  POSTGRES_DB: shop
---
apiVersion: v1
kind: Secret
metadata:
  name: ordering-secret
  namespace: shop
type: Opaque
stringData:
  DATABASE_URL: postgres://shop:REPLACE_WITH_STRONG_PASSWORD@postgres:5432/shop?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-secret
  namespace: shop
type: Opaque
stringData:
  # 최소 32바이트 이상의 무작위 값. 예: openssl rand -base64 48
  JWT_SECRET: REPLACE_WITH_RANDOM_32B_PLUS
